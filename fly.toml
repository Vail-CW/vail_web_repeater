# fly.toml app configuration file generated for vail on 2025-05-27T15:49:40-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vail'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0 # Consider setting to 1 if you always want one running
  processes = ['app']

  # --- ADD THIS SECTION ---
  [[http_service.ports]]
    handlers = ["http"]
    port = 80

  [[http_service.ports]]
    handlers = ["tls", "http"] # For HTTPS
    port = 443
  # --- END OF ADDED PORTS SECTION ---

  # --- ADD THIS HEALTH CHECK SECTION (RECOMMENDED) ---
  [[http_service.checks]]
    interval = "10s"      # How often to check
    timeout = "2s"        # How long to wait for a response
    grace_period = "5s"   # How long to wait after a machine starts before checking
    # For a simple TCP check to see if the port is open:
   type = "tcp" # If using TCP check, remove method, path, protocol below

  
  # --- END OF ADDED CHECKS SECTION ---

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
